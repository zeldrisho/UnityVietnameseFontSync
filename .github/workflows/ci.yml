name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore UnityVietnameseFontSync.slnx --locked-mode
      - run: dotnet format whitespace UnityVietnameseFontSync.slnx --no-restore --verify-no-changes
      - run: dotnet build UnityVietnameseFontSync.slnx -c Release --no-restore --warnaserror
      - run: dotnet test tests/UnityVietnameseFontSync.Tests.csproj -c Release --no-build --no-restore
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: src/bin/Release/netstandard2.1/UnityVietnameseFontSync.dll
          if-no-files-found: error
